spring.application.name=history

spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=password
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=8082

server.tomcat.max-swallow-size=-1
server.tomcat.max-http-form-post-size=500000000

jwt.secret=your-super-secret-key-here-which-is-very-long-1234567890
jwt.expiration=86400000

grpc.client.videoService.address=static://localhost:9090
grpc.client.videoService.negotiationType=plaintext